name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l core agent cli server)" || (gofmt -l core agent cli server; exit 1)
      - run: make build
      - name: vet
        run: for m in core agent cli server; do (cd $m && go vet ./... && go vet -tags integration ./...) || exit 1; done
      - run: make test
      - name: cross-compile
        run: |
          (cd cli && GOOS=windows GOARCH=amd64 go build ./... && GOOS=darwin GOARCH=arm64 go build ./...)
          (cd server && GOOS=windows GOARCH=amd64 go build ./... && GOOS=darwin GOARCH=arm64 go build ./...)

  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli, server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: ${{ matrix.module }}
          args: --config ../.golangci.yml

  integration:
    name: integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make test-integration PG_VERSIONS=${{ matrix.pg }}

  web:
    name: web (check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          retention-days: 7
