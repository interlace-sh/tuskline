name: ci

# Toolchain versions come from .prototools (proto); tasks, their inputs and
# their dependencies come from .moon/ and each project's moon.yml. CI never
# re-implements a task: if it fails here, `moon run <target>` reproduces it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moon:
    name: moon ci (build, lint, test, cross-compile, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # moon compares against the merge base to find affected projects,
          # so it needs history; blobless keeps the clone fast.
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@v0
        with:
          # `proto install`: go, node, npm, moon and golangci-lint from .prototools.
          auto-install: true
      # Runs every affected task with runInCI enabled (see .moon/tasks/go.yml
      # and the project moon.yml files). Integration tests are excluded and
      # run in the matrix below.
      - run: moon ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-build
          path: web/build
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Docker is available on GitHub-hosted Ubuntu runners; testcontainers
      # starts postgres:${{ matrix.pg }}. The env var beats the task default.
      - run: moon run core:integration
        env:
          PG_VERSIONS: ${{ matrix.pg }}
