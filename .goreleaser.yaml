# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release skeleton (roadmap M0.8): `tl` (Apache-2.0) and `tuskline`
# (AGPL-3.0-only, web UI embedded) for linux/darwin/windows x amd64/arm64,
# with checksums and an SBOM per archive. Nothing is published yet:
# `release.disable` is set and there are no brews, dockers or signs.
#
# Local dry run (writes dist/; goreleaser and syft are fetched with go run):
#   moon run scripts:release-snapshot
version: 2

project_name: tuskline

before:
  hooks:
    # Builds web/ and copies it into server/internal/webui/dist for go:embed.
    - moon run server:embed-web

builds:
  - id: tl
    dir: cli
    main: ./cmd/tl
    binary: tl
    env: ['CGO_ENABLED=0']
    flags: ['-trimpath']
    ldflags:
      - -s -w
      - -X github.com/interlace-sh/tuskline/core/version.Version={{ .Version }}
      - -X github.com/interlace-sh/tuskline/core/version.Commit={{ .ShortCommit }}
      - -X github.com/interlace-sh/tuskline/core/version.Date={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: tuskline
    dir: server
    main: ./cmd/tuskline
    binary: tuskline
    env: ['CGO_ENABLED=0']
    flags: ['-trimpath']
    ldflags:
      - -s -w
      - -X github.com/interlace-sh/tuskline/core/version.Version={{ .Version }}
      - -X github.com/interlace-sh/tuskline/core/version.Commit={{ .ShortCommit }}
      - -X github.com/interlace-sh/tuskline/core/version.Date={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # Separate archives keep the licences apart: tl is Apache-2.0 only.
  - id: tl
    ids: [tl]
    name_template: 'tl_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: cli/LICENSE
        dst: LICENSE
      - LICENSING.md
      - README.md

  - id: tuskline
    ids: [tuskline]
    name_template: 'tuskline_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      # The server links the Apache-2.0 core.
      - src: core/LICENSE
        dst: LICENSE.core
      - LICENSING.md
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  # One SPDX SBOM per archive, generated by syft. `go run` pins syft without
  # adding a tool to .prototools; keep the version in step with scripts/moon.yml.
  - artifacts: archive
    cmd: go
    args: ['run', 'github.com/anchore/syft/cmd/syft@v1.55.0', '$artifact', '--output', 'spdx-json=$document']

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # No publishing until a release is explicitly approved.
  disable: true
