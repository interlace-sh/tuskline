# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Repository-wide checks that span several modules, so they belong to no
# single Go project. The scripts call `go` from .prototools via proto's shims.
language: 'bash'
layer: 'tool'
stack: 'infrastructure'
tags: ['repo']

project:
  title: 'scripts'
  description: 'Repository checks: licence boundary and SPDX headers (LICENSING.md, ADR 0010).'

toolchains:
  default: 'system'

fileGroups:
  gosources:
    - '/core/**/*.go'
    - '/cli/**/*.go'
    - '/agent/**/*.go'
    - '/server/**/*.go'
    - '/desktop/**/*.go'
    - '/*/go.mod'
    - '/go.work'

tasks:
  licence-boundary:
    description: 'Fail on AGPL imports from core, cli or agent, or a missing SPDX header'
    command: 'bash check-licence-boundary.sh $workspaceRoot'
    inputs:
      - 'check-licence-boundary.sh'
      - '@group(gosources)'
    tags: ['licence']

  test:
    description: 'Self-test the licence boundary and the PATH linker'
    script: |
      bash check-licence-boundary.test.sh
      bash link-bin.test.sh
    inputs:
      - 'check-licence-boundary.sh'
      - 'check-licence-boundary.test.sh'
      - 'link-bin.sh'
      - 'link-bin.test.sh'
    tags: ['licence']

  release-check:
    description: 'Validate .goreleaser.yaml'
    command: 'go run github.com/goreleaser/goreleaser/v2@v2.19.0 check'
    inputs:
      - '/.goreleaser.yaml'
    tags: ['release']
    options:
      runFromWorkspaceRoot: true

  release-snapshot:
    description: 'Local release dry run into dist/: tl and tuskline archives, checksums and SBOMs; publishes nothing'
    command: 'go run github.com/goreleaser/goreleaser/v2@v2.19.0 release --snapshot --clean'
    tags: ['release']
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: false

  image-smoke:
    description: 'Build the Docker image and check health, the embedded UI and the non-root user (needs Docker)'
    command: 'bash image-smoke.sh'
    tags: ['docker']
    options:
      # Talks to Docker, so never trust a cached pass. CI runs it in its own
      # job (ci.yml); `false` would also block that explicit `moon run`.
      cache: false
      runInCI: 'always'

  check:
    description: 'Everything a pull request must pass for repository-wide checks'
    command: 'noop'
    deps: ['~:licence-boundary', '~:test', '~:release-check']
    tags: ['repo']
